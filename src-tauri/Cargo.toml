[package]
name = "lifting-plan-calculator"
version = "2.6.0"
description = "Lifting plan calculator for rigging and crane lifts"
authors = ["Zhafri Syazwi"]
edition = "2021"
rust-version = "1.85"

[lib]
name = "lifting_plan_calculator_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
calamine = "0.36.1"
rfd = "0.17.2"
ureq = { version = "2", default-features = false, features = ["tls", "gzip"] }
lopdf = { version = "0.42.0", default-features = false }

# The PDF export prints the report in the app's own WebKit view, so no browser
# has to be installed on the machine (and none is carried in the AppImage).
[target.'cfg(target_os = "linux")'.dependencies]
gtk = "0.18"
webkit2gtk = "2.0"

[dev-dependencies]
zip = "8.6.0"

[profile.release]
codegen-units = 1
lto = true
opt-level = "s"
panic = "abort"
strip = true
