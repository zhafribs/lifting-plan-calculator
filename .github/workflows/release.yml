name: Release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write

env:
  CARGO_TERM_COLOR: always

jobs:
  release:
    name: Build AppImage and publish
    runs-on: ubuntu-22.04
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            build-essential curl wget file patchelf python3 xz-utils \
            libwebkit2gtk-4.1-dev libgtk-3-dev librsvg2-dev libssl-dev \
            zlib1g-dev libsoup-3.0-dev pkg-config

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Cache cargo
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri

      - name: Install the Tauri CLI
        run: cargo install tauri-cli --locked

      - name: Build the AppImage
        env:
          APPIMAGE_EXTRACT_AND_RUN: "1"
        run: ./build-appimage.sh

      - name: Generate checksums
        run: |
          cd dist
          sha256sum ./*.appimage > SHA256SUMS.txt
          cat SHA256SUMS.txt

      - name: Publish the release
        uses: softprops/action-gh-release@v2
        with:
          files: |
            dist/*.appimage
            dist/SHA256SUMS.txt
          generate_release_notes: true
          fail_on_unmatched_files: true
