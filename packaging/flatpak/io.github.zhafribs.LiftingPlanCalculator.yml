app-id: io.github.zhafribs.LiftingPlanCalculator
runtime: org.gnome.Platform
runtime-version: '48'
sdk: org.gnome.Sdk
command: lifting-plan-calculator

# The runtime carries GTK 3 and WebKitGTK 4.1, which is what the release binary
# links against; nothing is compiled here.
finish-args:
  - --share=ipc
  - --socket=wayland
  - --socket=fallback-x11
  - --device=dri
  # The update check asks GitHub; the report is saved through the file chooser.
  - --share=network
  - --filesystem=xdg-download
  - --filesystem=xdg-documents

modules:
  - name: lifting-plan-calculator
    buildsystem: simple
    build-commands:
      - install -Dm755 lifting-plan-calculator /app/bin/lifting-plan-calculator
      - install -Dm644 io.github.zhafribs.LiftingPlanCalculator.desktop
        /app/share/applications/io.github.zhafribs.LiftingPlanCalculator.desktop
      - install -Dm644 io.github.zhafribs.LiftingPlanCalculator.png
        /app/share/icons/hicolor/128x128/apps/io.github.zhafribs.LiftingPlanCalculator.png
      - install -Dm644 io.github.zhafribs.LiftingPlanCalculator.metainfo.xml
        /app/share/metainfo/io.github.zhafribs.LiftingPlanCalculator.metainfo.xml
      - install -Dm644 LICENSE
        /app/share/licenses/io.github.zhafribs.LiftingPlanCalculator/LICENSE
      - install -Dm644 THIRD_PARTY_NOTICES.md
        /app/share/licenses/io.github.zhafribs.LiftingPlanCalculator/THIRD_PARTY_NOTICES.md
    sources:
      - type: file
        path: lifting-plan-calculator
      - type: file
        path: io.github.zhafribs.LiftingPlanCalculator.desktop
      - type: file
        path: io.github.zhafribs.LiftingPlanCalculator.png
      - type: file
        path: io.github.zhafribs.LiftingPlanCalculator.metainfo.xml
      - type: file
        path: LICENSE
      - type: file
        path: THIRD_PARTY_NOTICES.md
