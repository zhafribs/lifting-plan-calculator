[package]
name = "lifting-plan-calculator"
version = "2.1.0"
description = "Lifting plan calculator for rigging and crane lifts"
authors = ["Zhafri Syazwi"]
edition = "2021"
rust-version = "1.85"

[lib]
name = "lifting_plan_calculator_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
calamine = "0.36.1"
rfd = "0.17.2"

[dev-dependencies]
zip = "8.6.0"

[profile.release]
codegen-units = 1
lto = true
opt-level = "s"
panic = "abort"
strip = true
