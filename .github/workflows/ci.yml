name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always

jobs:
  test:
    name: Test
    runs-on: ubuntu-22.04
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          # The notes check compares every tag against docs/releases/.
          fetch-depth: 0

      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            libwebkit2gtk-4.1-dev libgtk-3-dev librsvg2-dev libssl-dev \
            zlib1g-dev libsoup-3.0-dev pkg-config

      - name: Install Rust
        uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec # stable
        with:
          components: clippy

      - name: Cache cargo
        uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2
        with:
          workspaces: src-tauri

      - name: cargo test
        run: cargo test --manifest-path src-tauri/Cargo.toml --all-targets

      - name: cargo clippy
        run: cargo clippy --manifest-path src-tauri/Cargo.toml --all-targets -- -D warnings

      - name: Syntax-check the frontend
        run: |
          set -e
          mkdir -p /tmp/jschk
          printf '{"type":"module"}\n' > /tmp/jschk/package.json
          while IFS= read -r -d '' f; do
            cp "$f" /tmp/jschk/check.mjs
            node --check /tmp/jschk/check.mjs
          done < <(find ui/js -name '*.js' -print0)
          echo "checked $(find ui/js -name '*.js' | wc -l) modules"

      # Every tag has its own notes file, and the release workflow publishes
      # exactly that file. A broken record is a red build, not a broken release.
      # The self-test runs first: it proves the checker still rejects the defect
      # it was written for, so a future edit cannot quietly weaken it.
      - name: Self-test the release-notes checker
        run: ./packaging/check-release-notes.sh --self-test

      - name: Check the release notes
        run: ./packaging/check-release-notes.sh

  # The PDF export prints the report with the app's own WebKitGTK view, which
  # needs a display. Everything else in the suite is headless; this job is the
  # one place the real export runs end to end.
  pdf-export:
    name: PDF export
    runs-on: ubuntu-22.04
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            libwebkit2gtk-4.1-dev libgtk-3-dev librsvg2-dev libssl-dev \
            zlib1g-dev libsoup-3.0-dev pkg-config \
            xvfb dbus-x11 poppler-utils fonts-liberation fonts-dejavu-core

      - name: Install Rust
        uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec # stable

      - name: Cache cargo
        uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2
        with:
          workspaces: src-tauri

      - name: Build the worked-example report
        run: cargo run --quiet --manifest-path src-tauri/Cargo.toml --example dump_fixtures

      - name: Print the worked-example plan
        env:
          WEBKIT_DISABLE_COMPOSITING_MODE: "1"
          WEBKIT_DISABLE_DMABUF_RENDERER: "1"
          LIBGL_ALWAYS_SOFTWARE: "1"
        run: |
          set -euo pipefail
          xvfb-run -a dbus-run-session -- \
            cargo run --quiet --manifest-path src-tauri/Cargo.toml --example export_pdf -- \
              /tmp/opencode/fixtures/report.html /tmp/plan.pdf \
              "Nguyễn Văn Ánh — LP/2026 (A)"

      # Runner images carry a different WebKitGTK from the developer machine
      # (2.44 on ubuntu-22.04), so the page count is a floor guard rather than a
      # golden number, and every page that exists is checked. The committed
      # fixture the unit tests use was printed by 2.54, which covers the Skia
      # output this job may not reach.
      - name: Check the printed plan
        run: |
          set -euo pipefail
          pdfinfo /tmp/plan.pdf | tee /tmp/pdfinfo.txt
          pages="$(awk '/^Pages:/{print $2}' /tmp/pdfinfo.txt)"
          [ "$pages" -ge 5 ]
          # A4, measured rather than matched as a string.
          awk '/^Page size:/{ if ($3 > 594 && $3 < 596 && $5 > 841 && $5 < 843) ok = 1 } END { exit !ok }' /tmp/pdfinfo.txt
          # A page count alone would not notice content being lost — the counter
          # renumbers itself. The worked example's own sections must all be
          # there, whatever number of pages the runner's WebKit breaks it into.
          whole="$(pdftotext -layout /tmp/plan.pdf -)"
          for heading in 'PLAN DETAILS' 'LIFT INPUT PARAMETERS' 'GEOMETRIC' \
                         'RIGGING' 'FINAL CAPACITY' 'TANDEM'; do
            echo "$whole" | grep -q "$heading" || { echo "missing section: $heading"; exit 1; }
          done
          # The footer is on every page, in both scripts it was given.
          for page in $(seq 1 "$pages"); do
            text="$(pdftotext -f "$page" -l "$page" -layout /tmp/plan.pdf -)"
            echo "$text" | grep -q 'Nguyễn Văn Ánh — LP/2026 (A)'
            echo "$text" | grep -q "$page/$pages"
          done
          # And it sits in the bottom margin, not at the top: the bug that put it
          # upside down at y=30 was invisible to a text search.
          y="$(pdftotext -bbox -f 1 -l 1 /tmp/plan.pdf - \
            | awk '/Văn/{print $3}' | head -1 | tr -d 'yMin="')"
          awk -v y="$y" 'BEGIN { exit !(y > 790 && y < 842) }'
          # It is drawn on every page, not just present in the text layer: the
          # bottom 40 pt is inside the margin, so only the footer has ink there,
          # and a footer hidden behind a page background would leave it blank.
          pdftoppm -r 72 -gray /tmp/plan.pdf /tmp/page
          python3 - <<'PY'
          import glob, sys
          files = sorted(glob.glob('/tmp/page-*.pgm'))
          if len(files) < 5:
              sys.exit(f'expected the rendered pages, found {len(files)}')
          for path in files:
              raw = open(path, 'rb').read()
              magic, size, depth, pixels = raw.split(b'\n', 3)
              width, height = (int(n) for n in size.split())
              strip = pixels[(height - 40) * width:]
              ink = sum(1 for byte in strip if byte < 200)
              print(f'{path}: {ink} dark pixels in the footer band')
              if ink < 20:
                  sys.exit(f'{path} has no footer ink')
          PY
  # The PDF export added a small dependency tree of its own (a PDF writer and a
  # font parser), so advisories are checked rather than assumed.
  audit:
    name: Dependency audit
    runs-on: ubuntu-22.04
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Install Rust
        uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec # stable

      - name: Install cargo-audit
        run: cargo install cargo-audit --locked

      # Reported, not gating: the tree carries advisories inherited from the
      # Tauri/GTK stack (glib, rustls, zip, zstd, calamine, tokio) and from
      # crates with no fixed upgrade, so a blocking check would be red for
      # reasons this repository cannot fix. A new advisory in a crate this
      # project chooses still shows up here, and dependabot handles upgrades.
      - name: Audit the lockfile
        continue-on-error: true
        run: cargo audit --file src-tauri/Cargo.lock

  # The Windows export path (Edge, the process spawning and the platform
  # branches of the PDF code) is never compiled by the Linux jobs.
  windows-check:
    name: Windows compile
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Install Rust
        uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec # stable

      - name: Cache cargo
        uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2
        with:
          workspaces: src-tauri

      - name: cargo check
        run: cargo check --manifest-path src-tauri/Cargo.toml --all-targets
