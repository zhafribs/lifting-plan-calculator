name: Release

on:
  push:
    tags: ["v*"]
  # Manual run builds and uploads the artifacts without publishing a release,
  # so a release can be smoke-tested before it is tagged.
  workflow_dispatch:

permissions:
  contents: write

env:
  CARGO_TERM_COLOR: always

jobs:
  linux-appimage:
    name: Linux AppImage
    runs-on: ubuntu-22.04
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            build-essential curl wget file patchelf python3 xz-utils zsync \
            libwebkit2gtk-4.1-dev libgtk-3-dev librsvg2-dev libssl-dev \
            zlib1g-dev libsoup-3.0-dev pkg-config

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Cache cargo
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri

      - name: Install the Tauri CLI
        run: cargo install tauri-cli --locked

      - name: Build the AppImage and its zsync sidecar
        env:
          APPIMAGE_EXTRACT_AND_RUN: "1"
        run: ./build-appimage.sh

      - name: Upload the Linux artifacts
        uses: actions/upload-artifact@v7
        with:
          name: linux
          path: |
            dist/*.AppImage
            dist/*.AppImage.zsync
          if-no-files-found: error

  windows-installers:
    name: Windows installers
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Cache cargo
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri

      - name: Install the Tauri CLI
        run: cargo install tauri-cli --locked

      # WiX (for the .msi) and NSIS (for the setup .exe) are fetched and driven
      # by the Tauri bundler; windows-latest already has the MSVC toolchain and
      # the WebView2 runtime.
      - name: Build the MSI and NSIS installers
        run: cargo tauri build --bundles msi,nsis
        working-directory: src-tauri

      - name: Rename the installers to the project convention
        shell: bash
        run: |
          set -e
          version="$(sed -n 's/.*"version": "\([^"]*\)".*/\1/p' src-tauri/tauri.conf.json | head -1)"
          mkdir -p dist
          msi="$(find src-tauri/target/release/bundle/msi -name '*.msi' | head -1)"
          exe="$(find src-tauri/target/release/bundle/nsis -name '*.exe' | head -1)"
          if [ -z "$msi" ]; then
            echo "No MSI was produced." >&2
            exit 1
          fi
          cp "$msi" "dist/Lifting-Plan-Calculator-${version}-windows-x86_64.msi"
          if [ -n "$exe" ]; then
            cp "$exe" "dist/Lifting-Plan-Calculator-${version}-windows-x86_64-setup.exe"
          fi
          ls -l dist

      - name: Upload the Windows artifacts
        uses: actions/upload-artifact@v7
        with:
          name: windows
          path: dist/*
          if-no-files-found: error

  publish:
    name: Publish the release
    needs: [linux-appimage, windows-installers]
    # Only a tag push publishes; a manual run stops after the artifacts upload.
    if: ${{ github.event_name == 'push' }}
    runs-on: ubuntu-22.04
    steps:
      - name: Download the build artifacts
        uses: actions/download-artifact@v8
        with:
          path: dist
          merge-multiple: true

      - name: Generate checksums
        run: |
          cd dist
          sha256sum ./* > SHA256SUMS.txt
          cat SHA256SUMS.txt

      - name: Publish the release
        uses: softprops/action-gh-release@v3
        with:
          files: |
            dist/*
          generate_release_notes: true
          fail_on_unmatched_files: true
