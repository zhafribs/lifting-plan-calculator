name: Release

on:
  push:
    tags: ["v*"]
  # Manual run builds and uploads the artifacts without publishing a release,
  # so a release can be smoke-tested before it is tagged.
  workflow_dispatch:

# Least privilege at the workflow level: only the publish job can write.
permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always
  # `actions/checkout` runs `git init`; without this git prints its hint about
  # the default branch on every job.
  GIT_CONFIG_COUNT: "1"
  GIT_CONFIG_KEY_0: init.defaultBranch
  GIT_CONFIG_VALUE_0: main
  # Pinned so the cached CLI binary has an explicit key: bump this to pick up a
  # newer CLI, and the cache refreshes itself on the next run.
  TAURI_CLI_VERSION: "2.12.4"

jobs:
  # Fails fast, before either platform build, if the tag is not publishable: a
  # bad tag name, a version that disagrees with the artifacts, missing notes, or
  # no accepted council record for the release.
  verify-notes:
    name: Release notes
    runs-on: ubuntu-22.04
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      # One page per tag. The check is the same script CI runs over every tag,
      # narrowed to this one, so the release gate is never weaker than the merge
      # gate.
      - name: Check the vendored viewer
        run: ./packaging/check-vendored.sh

      # A signed tree without its secret would build for 40 minutes and then
      # publish an update every installed copy refuses. Fail before the builds.
      - name: Check the signing key is available
        env:
          # A boolean, not the secret: this job runs repository scripts and has
          # no reason to see the key itself.
          HAS_SIGNING_KEY: ${{ secrets.UPDATE_SIGNING_KEY != '' }}
        run: |
          if [ -s src-tauri/update-public-key.txt ] && [ "$HAS_SIGNING_KEY" != "true" ]; then
            echo "::error::src-tauri/update-public-key.txt is set, so releases must be signed; add the UPDATE_SIGNING_KEY secret." >&2
            exit 1
          fi

      - name: Check the notes, the version and the council record
        if: ${{ github.event_name == 'push' }}
        run: ./packaging/check-release-notes.sh --tag "$GITHUB_REF_NAME"

  # The export is the feature this release is about, so the tag is checked by
  # printing the worked-example plan before either platform build starts.
  pdf-export:
    name: PDF export
    needs: [verify-notes]
    runs-on: ubuntu-22.04
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            libwebkit2gtk-4.1-dev libgtk-3-dev librsvg2-dev libssl-dev \
            zlib1g-dev libsoup-3.0-dev pkg-config \
            xvfb dbus-x11 poppler-utils fonts-liberation fonts-dejavu-core

      - name: Install Rust
        uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec # stable

      - name: Cache cargo
        uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2
        with:
          workspaces: src-tauri

      - name: Print the worked-example plan
        env:
          WEBKIT_DISABLE_COMPOSITING_MODE: "1"
          WEBKIT_DISABLE_DMABUF_RENDERER: "1"
          LIBGL_ALWAYS_SOFTWARE: "1"
          # No accessibility bus in this session; looking for one only logs a
          # dbind warning per print.
          NO_AT_BRIDGE: "1"
        run: |
          set -euo pipefail
          cargo run --quiet --manifest-path src-tauri/Cargo.toml --example dump_fixtures
          xvfb-run -a dbus-run-session -- \
            cargo run --quiet --manifest-path src-tauri/Cargo.toml --example export_pdf -- \
              /tmp/opencode/fixtures/report.html /tmp/plan.pdf "Release check — LP/2026 (A)"

      - name: Check the printed plan
        run: |
          set -euo pipefail
          pdfinfo /tmp/plan.pdf | tee /tmp/pdfinfo.txt
          pages="$(awk '/^Pages:/{print $2}' /tmp/pdfinfo.txt)"
          [ "$pages" -ge 5 ]
          pdftotext -f 1 -l 1 -layout /tmp/plan.pdf - | grep -q 'Release check — LP/2026 (A)'
          pdftotext -f "$pages" -l "$pages" -layout /tmp/plan.pdf - | grep -q "$pages/$pages"

  linux-appimage:
    name: Linux AppImage
    needs: [verify-notes, pdf-export]
    runs-on: ubuntu-22.04
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            build-essential curl wget file patchelf python3 xz-utils zsync \
            libwebkit2gtk-4.1-dev libgtk-3-dev librsvg2-dev libssl-dev \
            zlib1g-dev libsoup-3.0-dev pkg-config

      - name: Install Rust
        uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec # stable

      - name: Cache cargo
        uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2
        with:
          workspaces: src-tauri

      # The CLI is a one-time ~5 minute compile with `cargo install`. Its
      # release carries prebuilt binaries, so fetch one and cache it instead.
      - name: Cache the Tauri CLI
        id: tauri-cli
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6
        with:
          path: ~/.cargo/bin/cargo-tauri
          key: cargo-tauri-${{ runner.os }}-${{ env.TAURI_CLI_VERSION }}-820ae3c7

      - name: Install the Tauri CLI
        if: steps.tauri-cli.outputs.cache-hit != 'true'
        shell: bash
        run: |
          set -euo pipefail
          url="https://github.com/tauri-apps/tauri/releases/download/tauri-cli-v${TAURI_CLI_VERSION}/cargo-tauri-x86_64-unknown-linux-gnu.tgz"
          # Pinned: this binary builds the artifact users download.
          sha256="820ae3c7580ca637cad15f65638960ee2a96e5a491e224691c86d6f25e6c9e8a"
          archive="$(mktemp)"
          curl -sSfL -o "$archive" "$url"
          if ! echo "${sha256}  ${archive}" | sha256sum --check --status -; then
            echo "::error::the Tauri CLI archive does not match its pinned digest" >&2
            rm -f "$archive"
            exit 1
          fi
          mkdir -p "$HOME/.cargo/bin"
          tar -xzf "$archive" -C "$HOME/.cargo/bin" cargo-tauri
          rm -f "$archive"
          chmod +x "$HOME/.cargo/bin/cargo-tauri"

      - name: Show the Tauri CLI version
        run: cargo tauri --version

      # The bundle carries no PDF renderer: the app prints the plan with its own
      # WebKitGTK view, so nothing is downloaded and nothing is bundled.

      # linuxdeploy and appimagetool, fetched by the bundler on first use.
      - name: Cache the bundler tools
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6
        with:
          path: ~/.cache/tauri
          key: tauri-tools-${{ runner.os }}-${{ env.TAURI_CLI_VERSION }}

      - name: Build the AppImage and its zsync sidecar
        env:
          APPIMAGE_EXTRACT_AND_RUN: "1"
        run: ./build-appimage.sh

      # The PDF export prints with the app's own WebKitGTK view, so the bundle
      # must carry GTK's "Print to File" backend, and must not carry a browser.
      # Neither is visible from a build log, so the payload is inspected here.
      - name: Check the AppImage payload
        env:
          APPIMAGE_EXTRACT_AND_RUN: "1"
        run: |
          set -euo pipefail
          image="$(find dist -maxdepth 1 -name '*.AppImage' | head -1)"
          work="$(mktemp -d)"
          cd "$work"
          "$GITHUB_WORKSPACE/$image" --appimage-extract >/dev/null
          if ! find squashfs-root -name 'libprintbackend-file.so' | grep -q .; then
            echo "ERROR: the AppImage has no GTK file print backend; Save as PDF cannot work." >&2
            exit 1
          fi
          # The frontend is embedded in the binary, so the viewer's presence is
          # proved by its own marker rather than by a loose file.
          binary="$(find squashfs-root -type f -name 'lifting-plan-calculator' | head -1)"
          if ! grep -q 'pdf.worker' "$binary"; then
            echo "ERROR: the vendored PDF viewer is missing from the bundle." >&2
            exit 1
          fi
          if find squashfs-root -name 'chrome-headless-shell*' | grep -q .; then
            echo "ERROR: a browser payload is inside the AppImage; 2.6.0 carries none." >&2
            exit 1
          fi
          size="$(stat -c %s "$GITHUB_WORKSPACE/$image")"
          echo "AppImage: $((size / 1024 / 1024)) MB"
          if [ "$size" -gt $((95 * 1024 * 1024)) ]; then
            echo "ERROR: the AppImage is larger than 95 MB; a browser payload came back." >&2
            exit 1
          fi

      # The digests of what this job built. The publish job compares them with
      # what it downloads, so the checksum manifest is not merely a restatement
      # of the artifact store.
      - name: Record the build-time digests
        run: |
          set -euo pipefail
          (cd dist && sha256sum ./*) > "$RUNNER_TEMP/digests-linux.txt"
          cat "$RUNNER_TEMP/digests-linux.txt"

      - name: Upload the Linux digests
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: digests-linux
          path: ${{ runner.temp }}/digests-linux.txt
          if-no-files-found: error

      - name: Upload the Linux artifacts
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: linux
          path: |
            dist/*.AppImage
            dist/*.AppImage.zsync
            dist/*.deb
            dist/*.rpm
          if-no-files-found: error

      # The Arch package and the Flatpak are built from this same binary.
      - name: Upload the release binary
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: linux-binary
          path: src-tauri/target/release/lifting-plan-calculator
          if-no-files-found: error

  # The same binary, packaged for Arch and for Flatpak. Neither compiles the
  # app: they wrap the release binary in the distribution's own conventions.
  linux-distro-packages:
    name: Arch package and Flatpak
    needs: [linux-appimage]
    # 24.04 carries flatpak-builder 1.4, which knows AppStream 1's
    # `appstreamcli-compose`; 22.04's 1.2 calls the removed `appstream-compose`
    # and fails inside the SDK, which no longer ships that name.
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      # `gh`, not actions/download-artifact: the action's bundled Node emits a
      # Buffer deprecation warning on the log.
      - name: Download the release binary
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh run download "$GITHUB_RUN_ID" --repo "$GITHUB_REPOSITORY" \
            --name linux-binary --dir src-tauri/target/release

      - name: Make the binary executable
        run: chmod +x src-tauri/target/release/lifting-plan-calculator

      # makepkg refuses to run as root, so the package is built as a user inside
      # the Arch container.
      - name: Build the Arch package
        run: |
          set -euo pipefail
          docker run --rm -v "$GITHUB_WORKSPACE:/work" -w /work archlinux:base-devel bash -lc '
            set -euo pipefail
            # The image already carries base-devel and zstd. The package's own
            # dependencies are installed so makepkg checks them, instead of
            # being told to skip the check.
            pacman -Syu --noconfirm --needed webkit2gtk-4.1 gtk3 librsvg
            useradd -m build
            chown -R build /work
            su build -c "cd /work && ./packaging/make-arch-package.sh"
          '
          # The container took the workspace; give it back, or later steps
          # cannot write to dist/.
          sudo chown -R "$(id -u):$(id -g)" "$GITHUB_WORKSPACE"

      - name: Install Flatpak tooling
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            flatpak flatpak-builder appstream-compose
          # Everything below runs unprivileged, as on a developer's machine.
          flatpak remote-add --user --if-not-exists flathub \
            https://flathub.org/repo/flathub.flatpakrepo
          flatpak install --user -y --noninteractive flathub \
            org.gnome.Platform//50 org.gnome.Sdk//50

      - name: Build the Flatpak
        run: ./packaging/make-flatpak.sh

      - name: Upload the distribution packages
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: distro
          path: |
            dist/*.pkg.tar.zst
            dist/*.flatpak
          if-no-files-found: error

  windows-installers:
    name: Windows installers
    needs: [verify-notes, pdf-export]
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Install Rust
        uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec # stable

      - name: Cache cargo
        uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2
        with:
          workspaces: src-tauri

      - name: Cache the Tauri CLI
        id: tauri-cli
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6
        with:
          path: ~/.cargo/bin/cargo-tauri.exe
          key: cargo-tauri-${{ runner.os }}-${{ env.TAURI_CLI_VERSION }}-820ae3c7

      - name: Install the Tauri CLI
        if: steps.tauri-cli.outputs.cache-hit != 'true'
        shell: pwsh
        run: |
          $url = "https://github.com/tauri-apps/tauri/releases/download/tauri-cli-v$env:TAURI_CLI_VERSION/cargo-tauri-x86_64-pc-windows-msvc.zip"
          $zip = Join-Path $env:RUNNER_TEMP "cargo-tauri.zip"
          $out = Join-Path $env:RUNNER_TEMP "cargo-tauri"
          Invoke-WebRequest -Uri $url -OutFile $zip
          # Pinned: this binary builds the artifact users download.
          $sha256 = "3e8687fb184bd7f10ebd8642f7715f79f4a605c0694c142a21507e8a24dc0f8b"
          $actual = (Get-FileHash -Path $zip -Algorithm SHA256).Hash.ToLower()
          if ($actual -ne $sha256) { throw "the Tauri CLI archive does not match its pinned digest" }
          Expand-Archive -Path $zip -DestinationPath $out -Force
          $dest = Join-Path $env:USERPROFILE ".cargo\bin"
          New-Item -ItemType Directory -Force -Path $dest | Out-Null
          Copy-Item (Join-Path $out "cargo-tauri.exe") $dest

      - name: Show the Tauri CLI version
        run: cargo tauri --version

      # WiX and NSIS, fetched by the bundler on first use.
      - name: Cache the bundler tools
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6
        with:
          path: ~/AppData/Local/tauri
          key: tauri-tools-${{ runner.os }}-${{ env.TAURI_CLI_VERSION }}

      # WiX (for the .msi) and NSIS (for the setup .exe) are fetched and driven
      # by the Tauri bundler; windows-latest already has the MSVC toolchain and
      # the WebView2 runtime.
      - name: Build the MSI and NSIS installers
        run: cargo tauri build --bundles msi,nsis
        working-directory: src-tauri

      - name: Rename the installers to the project convention
        shell: bash
        run: |
          set -e
          version="$(sed -n 's/.*"version": "\([^"]*\)".*/\1/p' src-tauri/tauri.conf.json | head -1)"
          mkdir -p dist
          msi="$(find src-tauri/target/release/bundle/msi -name '*.msi' | head -1)"
          exe="$(find src-tauri/target/release/bundle/nsis -name '*.exe' | head -1)"
          if [ -z "$msi" ]; then
            echo "No MSI was produced." >&2
            exit 1
          fi
          cp "$msi" "dist/Lifting-Plan-Calculator-${version}-windows-x86_64.msi"
          if [ -n "$exe" ]; then
            cp "$exe" "dist/Lifting-Plan-Calculator-${version}-windows-x86_64-setup.exe"
          fi
          ls -l dist

      - name: Record the build-time digests
        shell: pwsh
        run: |
          $lines = Get-ChildItem dist -File | ForEach-Object {
            "$((Get-FileHash $_.FullName -Algorithm SHA256).Hash.ToLower())  ./$($_.Name)"
          }
          $lines | Set-Content -Encoding ascii (Join-Path $env:RUNNER_TEMP "digests-windows.txt")
          Get-Content (Join-Path $env:RUNNER_TEMP "digests-windows.txt")

      - name: Upload the Windows digests
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: digests-windows
          path: ${{ runner.temp }}/digests-windows.txt
          if-no-files-found: error

      - name: Upload the Windows artifacts
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: windows
          path: dist/*
          if-no-files-found: error

  publish:
    name: Publish the release
    needs: [verify-notes, linux-appimage, linux-distro-packages, windows-installers]
    # Only a tag push publishes; a manual run stops after the artifacts upload.
    if: ${{ github.event_name == 'push' }}
    runs-on: ubuntu-22.04
    permissions:
      contents: write
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          # This job holds a write token; keep it out of .git/config so the
          # steps that run repo scripts cannot read it.
          persist-credentials: false

      # Re-checked at the sink, not only in verify-notes: this is the job that
      # turns the tag name into a path and into action inputs.
      - name: Re-check the tag
        run: ./packaging/check-release-notes.sh --tag "$GITHUB_REF_NAME"

      - name: Download the build artifacts
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          mkdir -p dist
          for artifact in linux distro windows; do
            gh run download "$GITHUB_RUN_ID" --repo "$GITHUB_REPOSITORY" \
              --name "$artifact" --dir dist
          done
          ls -l dist

      # `if-no-files-found` cannot see a silently skipped .zsync, so every
      # asset is named and required here.
      - name: Check that all eight assets exist
        run: |
          set -euo pipefail
          version="$(sed -n 's/.*"version": "\([^"]*\)".*/\1/p' src-tauri/tauri.conf.json | head -1)"
          for file in \
            "Lifting-Plan-Calculator-${version}-linux-x86_64.AppImage" \
            "Lifting-Plan-Calculator-${version}-linux-x86_64.AppImage.zsync" \
            "Lifting-Plan-Calculator-${version}-linux-amd64.deb" \
            "Lifting-Plan-Calculator-${version}-linux-x86_64.rpm" \
            "Lifting-Plan-Calculator-${version}-linux-x86_64.pkg.tar.zst" \
            "Lifting-Plan-Calculator-${version}-linux-x86_64.flatpak" \
            "Lifting-Plan-Calculator-${version}-windows-x86_64.msi" \
            "Lifting-Plan-Calculator-${version}-windows-x86_64-setup.exe"; do
            if [ ! -s "dist/$file" ]; then
              echo "::error::dist/$file is missing — a release is not published with a partial set."
              exit 1
            fi
          done
          ls -l dist

      - name: Download the build-time digests
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          mkdir -p digests
          for artifact in digests-linux digests-windows; do
            gh run download "$GITHUB_RUN_ID" --repo "$GITHUB_REPOSITORY" \
              --name "$artifact" --dir digests
          done

      # A tag cannot vouch for bytes. The jobs that produced them recorded their
      # digests; a mismatch means the artifact store handed us something else.
      - name: Check the artifacts against their build-time digests
        run: |
          set -euo pipefail
          checked=0
          for record in digests/*.txt; do
            while read -r hash name; do
              # PowerShell writes CRLF; a trailing carriage return would make
              # every Windows file look absent.
              hash="${hash%$'\r'}"
              name="${name%$'\r'}"
              [ -n "${hash:-}" ] || continue
              [ -f "dist/${name#./}" ] || { echo "::error::${name#./} is missing"; exit 1; }
              actual="$(sha256sum "dist/${name#./}" | cut -d' ' -f1)"
              if [ "$actual" != "$hash" ]; then
                echo "::error::${name#./} does not match the digest its build job recorded" >&2
                exit 1
              fi
              checked=$((checked + 1))
            done < "$record"
          done
          if [ "$checked" -eq 0 ]; then
            echo "::error::no build-time digests were found" >&2
            exit 1
          fi
          echo "all $checked artifacts match their build-time digests"

      - name: Generate checksums
        run: |
          cd dist
          sha256sum ./* > SHA256SUMS.txt
          cat SHA256SUMS.txt

      # Authorship: the digests below only mean something if the app can prove
      # who wrote them. A tree without a key signs nothing (bootstrap); a tree
      # with one must be signed, or the release fails rather than shipping an
      # update every installed copy will refuse.
      - name: Install Rust (to run the signer)
        uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec # stable

      # Built before the secret is in scope: the signer is a small standalone
      # crate with no GTK dependencies, so this job can build it in seconds.
      - name: Build the signer
        run: cargo build --locked --manifest-path tools/sign-manifest/Cargo.toml

      - name: Sign the checksums
        env:
          UPDATE_SIGNING_KEY: ${{ secrets.UPDATE_SIGNING_KEY }}
        run: |
          set -euo pipefail
          if [ ! -s src-tauri/update-public-key.txt ]; then
            echo "unsigned build: no update key is configured yet"
            exit 0
          fi
          if [ -z "${UPDATE_SIGNING_KEY:-}" ]; then
            echo "::error::src-tauri/update-public-key.txt is set, so the manifest must be signed; add the UPDATE_SIGNING_KEY secret." >&2
            exit 1
          fi
          signer=tools/sign-manifest/target/debug/sign-manifest
          "$signer" sign dist/SHA256SUMS.txt dist/SHA256SUMS.txt.sig \
            --expect src-tauri/update-public-key.txt
          # Prove the signature the release is about to carry verifies under the
          # key compiled into the app, not merely that a file was written.
          "$signer" verify dist/SHA256SUMS.txt dist/SHA256SUMS.txt.sig \
            --expect src-tauri/update-public-key.txt
          test -s dist/SHA256SUMS.txt.sig

      # A rerun must not quietly replace published bytes: a leftover draft is
      # deleted, a published release is refused (see CONTRIBUTING.md). The
      # release stays a draft until every asset is on it.
      # The body is exactly this tag's notes file: nothing from an earlier
      # release can appear on a later page.
      - name: Upload to a draft release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          repo="$GITHUB_REPOSITORY"
          tag="$GITHUB_REF_NAME"
          if gh release view "$tag" --repo "$repo" >/dev/null 2>&1; then
            if [ "$(gh release view "$tag" --repo "$repo" --json isDraft --jq .isDraft)" = "true" ]; then
              gh release delete "$tag" --repo "$repo" --yes
            else
              echo "::error::release $tag is already published - bump the version instead of replacing it."
              exit 1
            fi
          fi
          flags=(--draft --title "Lifting Plan Calculator $tag" --notes-file "docs/releases/$tag.md")
          case "$tag" in
            *-*) flags+=(--prerelease) ;;
          esac
          gh release create "$tag" dist/* --repo "$repo" "${flags[@]}"

      # The release becomes public only once every asset uploaded.
      - name: Publish the draft
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: gh release edit "$GITHUB_REF_NAME" --draft=false --repo "$GITHUB_REPOSITORY"
