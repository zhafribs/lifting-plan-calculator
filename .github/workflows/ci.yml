name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always

jobs:
  test:
    name: Test
    runs-on: ubuntu-22.04
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            libwebkit2gtk-4.1-dev libgtk-3-dev librsvg2-dev libssl-dev \
            zlib1g-dev libsoup-3.0-dev pkg-config

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy

      - name: Cache cargo
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri

      - name: cargo test
        run: cargo test --manifest-path src-tauri/Cargo.toml --all-targets

      - name: cargo clippy
        run: cargo clippy --manifest-path src-tauri/Cargo.toml --all-targets

      - name: Syntax-check the frontend
        run: |
          set -e
          mkdir -p /tmp/jschk
          printf '{"type":"module"}\n' > /tmp/jschk/package.json
          while IFS= read -r -d '' f; do
            cp "$f" /tmp/jschk/check.mjs
            node --check /tmp/jschk/check.mjs
          done < <(find ui/js -name '*.js' -print0)
          echo "checked $(find ui/js -name '*.js' | wc -l) modules"
