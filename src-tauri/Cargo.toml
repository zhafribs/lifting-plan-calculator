[package]
name = "lifting-plan-calculator"
version = "2.8.1"
description = "Lifting plan calculator for rigging and crane lifts"
authors = ["Zhafri Syazwi"]
edition = "2021"
rust-version = "1.85"

[lib]
name = "lifting_plan_calculator_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
calamine = "0.38.0"
rfd = "0.18.0"
ureq = { version = "2", default-features = false, features = ["tls", "gzip"] }
lopdf = { version = "0.47.0", default-features = false }

# The PDF export prints the report in the app's own WebKit view, so no browser
# has to be installed on the machine (and none is carried in the AppImage).
[target.'cfg(target_os = "linux")'.dependencies]
gtk = "0.18"
webkit2gtk = "2.0"

# Printing from the WebView2 the app already requires, so *Save as PDF* does not
# depend on the Edge browser being installed.
#
# These two are version-coupled to tauri's own webview2-com: the COM interfaces
# are passed between crates, so a different windows-core makes `Interface::cast`
# stop applying. When tauri is bumped, move both to the versions its lockfile
# resolves, then drop the dependabot ignore for them.
[target.'cfg(target_os = "windows")'.dependencies]
webview2-com = "0.39"
windows-core = "0.62"

[dev-dependencies]
zip = "9.5.1"

[profile.release]
codegen-units = 1
lto = true
opt-level = "s"
panic = "abort"
strip = true
