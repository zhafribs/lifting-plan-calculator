name: Release

on:
  push:
    tags: ["v*"]
  # Manual run builds and uploads the artifacts without publishing a release,
  # so a release can be smoke-tested before it is tagged.
  workflow_dispatch:

# Least privilege at the workflow level: only the publish job can write.
permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always
  # Pinned so the cached CLI binary has an explicit key: bump this to pick up a
  # newer CLI, and the cache refreshes itself on the next run.
  TAURI_CLI_VERSION: "2.12.4"

jobs:
  # Fails fast, before either platform build, if the tag is not publishable: a
  # bad tag name, a version that disagrees with the artifacts, missing notes, or
  # no accepted council record for the release.
  verify-notes:
    name: Release notes
    runs-on: ubuntu-22.04
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      # One page per tag. The check is the same script CI runs over every tag,
      # narrowed to this one, so the release gate is never weaker than the merge
      # gate.
      - name: Check the vendored viewer
        run: ./packaging/check-vendored.sh

      - name: Check the notes, the version and the council record
        if: ${{ github.event_name == 'push' }}
        run: ./packaging/check-release-notes.sh --tag "$GITHUB_REF_NAME"

  # The export is the feature this release is about, so the tag is checked by
  # printing the worked-example plan before either platform build starts.
  pdf-export:
    name: PDF export
    needs: [verify-notes]
    runs-on: ubuntu-22.04
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            libwebkit2gtk-4.1-dev libgtk-3-dev librsvg2-dev libssl-dev \
            zlib1g-dev libsoup-3.0-dev pkg-config \
            xvfb dbus-x11 poppler-utils fonts-liberation fonts-dejavu-core

      - name: Install Rust
        uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec # stable

      - name: Cache cargo
        uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2
        with:
          workspaces: src-tauri

      - name: Print the worked-example plan
        env:
          WEBKIT_DISABLE_COMPOSITING_MODE: "1"
          WEBKIT_DISABLE_DMABUF_RENDERER: "1"
          LIBGL_ALWAYS_SOFTWARE: "1"
        run: |
          set -euo pipefail
          cargo run --quiet --manifest-path src-tauri/Cargo.toml --example dump_fixtures
          xvfb-run -a dbus-run-session -- \
            cargo run --quiet --manifest-path src-tauri/Cargo.toml --example export_pdf -- \
              /tmp/opencode/fixtures/report.html /tmp/plan.pdf "Release check — LP/2026 (A)"

      - name: Check the printed plan
        run: |
          set -euo pipefail
          pdfinfo /tmp/plan.pdf | tee /tmp/pdfinfo.txt
          pages="$(awk '/^Pages:/{print $2}' /tmp/pdfinfo.txt)"
          [ "$pages" -ge 5 ]
          pdftotext -f 1 -l 1 -layout /tmp/plan.pdf - | grep -q 'Release check — LP/2026 (A)'
          pdftotext -f "$pages" -l "$pages" -layout /tmp/plan.pdf - | grep -q "$pages/$pages"

  linux-appimage:
    name: Linux AppImage
    needs: [verify-notes, pdf-export]
    runs-on: ubuntu-22.04
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            build-essential curl wget file patchelf python3 xz-utils zsync \
            libwebkit2gtk-4.1-dev libgtk-3-dev librsvg2-dev libssl-dev \
            zlib1g-dev libsoup-3.0-dev pkg-config

      - name: Install Rust
        uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec # stable

      - name: Cache cargo
        uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2
        with:
          workspaces: src-tauri

      # The CLI is a one-time ~5 minute compile with `cargo install`. Its
      # release carries prebuilt binaries, so fetch one and cache it instead.
      - name: Cache the Tauri CLI
        id: tauri-cli
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6
        with:
          path: ~/.cargo/bin/cargo-tauri
          key: cargo-tauri-${{ runner.os }}-${{ env.TAURI_CLI_VERSION }}

      - name: Install the Tauri CLI
        if: steps.tauri-cli.outputs.cache-hit != 'true'
        shell: bash
        run: |
          set -euo pipefail
          url="https://github.com/tauri-apps/tauri/releases/download/tauri-cli-v${TAURI_CLI_VERSION}/cargo-tauri-x86_64-unknown-linux-gnu.tgz"
          mkdir -p "$HOME/.cargo/bin"
          curl -sSfL "$url" | tar -xz -C "$HOME/.cargo/bin" cargo-tauri
          chmod +x "$HOME/.cargo/bin/cargo-tauri"

      - name: Show the Tauri CLI version
        run: cargo tauri --version

      # The bundle carries no PDF renderer: the app prints the plan with its own
      # WebKitGTK view, so nothing is downloaded and nothing is bundled.

      # linuxdeploy and appimagetool, fetched by the bundler on first use.
      - name: Cache the bundler tools
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6
        with:
          path: ~/.cache/tauri
          key: tauri-tools-${{ runner.os }}-${{ env.TAURI_CLI_VERSION }}

      - name: Build the AppImage and its zsync sidecar
        env:
          APPIMAGE_EXTRACT_AND_RUN: "1"
        run: ./build-appimage.sh

      # The PDF export prints with the app's own WebKitGTK view, so the bundle
      # must carry GTK's "Print to File" backend, and must not carry a browser.
      # Neither is visible from a build log, so the payload is inspected here.
      - name: Check the AppImage payload
        env:
          APPIMAGE_EXTRACT_AND_RUN: "1"
        run: |
          set -euo pipefail
          image="$(find dist -maxdepth 1 -name '*.AppImage' | head -1)"
          work="$(mktemp -d)"
          cd "$work"
          "$GITHUB_WORKSPACE/$image" --appimage-extract >/dev/null
          if ! find squashfs-root -name 'libprintbackend-file.so' | grep -q .; then
            echo "ERROR: the AppImage has no GTK file print backend; Save as PDF cannot work." >&2
            exit 1
          fi
          # The frontend is embedded in the binary, so the viewer's presence is
          # proved by its own marker rather than by a loose file.
          binary="$(find squashfs-root -type f -name 'lifting-plan-calculator' | head -1)"
          if ! grep -q 'pdf.worker' "$binary"; then
            echo "ERROR: the vendored PDF viewer is missing from the bundle." >&2
            exit 1
          fi
          if find squashfs-root -name 'chrome-headless-shell*' | grep -q .; then
            echo "ERROR: a browser payload is inside the AppImage; 2.6.0 carries none." >&2
            exit 1
          fi
          size="$(stat -c %s "$GITHUB_WORKSPACE/$image")"
          echo "AppImage: $((size / 1024 / 1024)) MB"
          if [ "$size" -gt $((95 * 1024 * 1024)) ]; then
            echo "ERROR: the AppImage is larger than 95 MB; a browser payload came back." >&2
            exit 1
          fi

      - name: Upload the Linux artifacts
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: linux
          path: |
            dist/*.AppImage
            dist/*.AppImage.zsync
          if-no-files-found: error

  windows-installers:
    name: Windows installers
    needs: [verify-notes, pdf-export]
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Install Rust
        uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec # stable

      - name: Cache cargo
        uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2
        with:
          workspaces: src-tauri

      - name: Cache the Tauri CLI
        id: tauri-cli
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6
        with:
          path: ~/.cargo/bin/cargo-tauri.exe
          key: cargo-tauri-${{ runner.os }}-${{ env.TAURI_CLI_VERSION }}

      - name: Install the Tauri CLI
        if: steps.tauri-cli.outputs.cache-hit != 'true'
        shell: pwsh
        run: |
          $url = "https://github.com/tauri-apps/tauri/releases/download/tauri-cli-v$env:TAURI_CLI_VERSION/cargo-tauri-x86_64-pc-windows-msvc.zip"
          $zip = Join-Path $env:RUNNER_TEMP "cargo-tauri.zip"
          $out = Join-Path $env:RUNNER_TEMP "cargo-tauri"
          Invoke-WebRequest -Uri $url -OutFile $zip
          Expand-Archive -Path $zip -DestinationPath $out -Force
          $dest = Join-Path $env:USERPROFILE ".cargo\bin"
          New-Item -ItemType Directory -Force -Path $dest | Out-Null
          Copy-Item (Join-Path $out "cargo-tauri.exe") $dest

      - name: Show the Tauri CLI version
        run: cargo tauri --version

      # WiX and NSIS, fetched by the bundler on first use.
      - name: Cache the bundler tools
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6
        with:
          path: ~/AppData/Local/tauri
          key: tauri-tools-${{ runner.os }}-${{ env.TAURI_CLI_VERSION }}

      # WiX (for the .msi) and NSIS (for the setup .exe) are fetched and driven
      # by the Tauri bundler; windows-latest already has the MSVC toolchain and
      # the WebView2 runtime.
      - name: Build the MSI and NSIS installers
        run: cargo tauri build --bundles msi,nsis
        working-directory: src-tauri

      - name: Rename the installers to the project convention
        shell: bash
        run: |
          set -e
          version="$(sed -n 's/.*"version": "\([^"]*\)".*/\1/p' src-tauri/tauri.conf.json | head -1)"
          mkdir -p dist
          msi="$(find src-tauri/target/release/bundle/msi -name '*.msi' | head -1)"
          exe="$(find src-tauri/target/release/bundle/nsis -name '*.exe' | head -1)"
          if [ -z "$msi" ]; then
            echo "No MSI was produced." >&2
            exit 1
          fi
          cp "$msi" "dist/Lifting-Plan-Calculator-${version}-windows-x86_64.msi"
          if [ -n "$exe" ]; then
            cp "$exe" "dist/Lifting-Plan-Calculator-${version}-windows-x86_64-setup.exe"
          fi
          ls -l dist

      - name: Upload the Windows artifacts
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: windows
          path: dist/*
          if-no-files-found: error

  publish:
    name: Publish the release
    needs: [verify-notes, linux-appimage, windows-installers]
    # Only a tag push publishes; a manual run stops after the artifacts upload.
    if: ${{ github.event_name == 'push' }}
    runs-on: ubuntu-22.04
    permissions:
      contents: write
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          # This job holds a write token; keep it out of .git/config so the
          # steps that run repo scripts cannot read it.
          persist-credentials: false

      # Re-checked at the sink, not only in verify-notes: this is the job that
      # turns the tag name into a path and into action inputs.
      - name: Re-check the tag
        run: ./packaging/check-release-notes.sh --tag "$GITHUB_REF_NAME"

      - name: Download the build artifacts
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8
        with:
          path: dist
          merge-multiple: true

      # `if-no-files-found` cannot see a silently skipped .zsync, so the four
      # assets are named and required here.
      - name: Check that all four assets exist
        run: |
          set -euo pipefail
          version="$(sed -n 's/.*"version": "\([^"]*\)".*/\1/p' src-tauri/tauri.conf.json | head -1)"
          for file in \
            "Lifting-Plan-Calculator-${version}-linux-x86_64.AppImage" \
            "Lifting-Plan-Calculator-${version}-linux-x86_64.AppImage.zsync" \
            "Lifting-Plan-Calculator-${version}-windows-x86_64.msi" \
            "Lifting-Plan-Calculator-${version}-windows-x86_64-setup.exe"; do
            if [ ! -s "dist/$file" ]; then
              echo "::error::dist/$file is missing — a release is not published with a partial set."
              exit 1
            fi
          done
          ls -l dist

      - name: Generate checksums
        run: |
          cd dist
          sha256sum ./* > SHA256SUMS.txt
          cat SHA256SUMS.txt

      # The body is exactly this tag's notes file: nothing from an earlier
      # release can appear on a later page.
      - name: Upload to a draft release
        uses: softprops/action-gh-release@8a0cd651e5b2365bd640854a3fa5dfc70e4875f3 # v3
        with:
          name: Lifting Plan Calculator ${{ github.ref_name }}
          draft: true
          prerelease: ${{ contains(github.ref_name, '-') }}
          # A rerun must not quietly replace published bytes; delete the draft
          # and rerun instead (see CONTRIBUTING.md).
          overwrite_files: false
          files: |
            dist/*
          body_path: docs/releases/${{ github.ref_name }}.md
          fail_on_unmatched_files: true

      # The release becomes public only once every asset uploaded.
      - name: Publish the draft
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: gh release edit "$GITHUB_REF_NAME" --draft=false --repo "$GITHUB_REPOSITORY"
